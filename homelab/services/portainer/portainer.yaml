services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - network-zone-a
    labels:
      - "traefik.enable=true"

      # HTTPS router
      - "traefik.http.routers.portainer-https.rule=Host(`portainer.home.arpa`)"
      - "traefik.http.routers.portainer-https.entrypoints=websecure"
      - "traefik.http.routers.portainer-https.tls=true"
      - "traefik.http.routers.portainer-https.tls.certresolver=stepca"

      # Portainer internal port
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

volumes:
  portainer_data:
